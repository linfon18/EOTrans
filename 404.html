<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面走丢了 | 有兽FANS2</title>
    <meta name="robots" content="noindex, follow">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: #fff;
        }

        /* 背景层 */
        .bg-layer {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
        }
        .bg-layer img, .bg-layer video {
            width: 100%; height: 100%;
            object-fit: cover;
        }

        /* 遮罩 */
        .overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(10, 15, 30, 0.45);
            z-index: 1;
        }

        /* 内容 */
        .content {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 2rem;
            max-width: 560px;
        }

        .code {
            font-size: clamp(6rem, 20vw, 12rem);
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(135deg, #f59e0b 0%, #fbbf24 40%, #f97316 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
            filter: drop-shadow(0 4px 20px rgba(245, 158, 11, 0.3));
            animation: float 4s ease-in-out infinite;
        }

        .msg {
            font-size: 1.3rem;
            margin: 1rem 0 0.5rem;
            font-weight: 600;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        .sub {
            font-size: 0.95rem;
            color: rgba(255,255,255,0.7);
            margin-bottom: 2.5rem;
            text-shadow: 0 1px 4px rgba(0,0,0,0.5);
        }

        .btn-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.8rem;
            border-radius: 50px;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #f59e0b, #f97316);
            color: #fff;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(245, 158, 11, 0.5);
        }

        .btn-ghost {
            background: rgba(255,255,255,0.1);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.25);
            backdrop-filter: blur(10px);
        }
        .btn-ghost:hover {
            background: rgba(255,255,255,0.2);
            transform: translateY(-2px);
        }

        /* 底部小字 */
        .footer {
            position: fixed;
            bottom: 1.5rem;
            left: 0; right: 0;
            text-align: center;
            z-index: 2;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.4);
        }

        /* 星星 */
        .stars {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        .star {
            position: absolute;
            width: 2px; height: 2px;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="bg-layer" id="bgLayer"></div>

    <div class="stars" id="stars"></div>

        <div class="sub" id="subMsg"></div>
        <div class="btn-group">
            <a href="https://eo.mczlf.loft.games" class="btn btn-primary">🏠 返回首页</a>
            <button class="btn btn-ghost" onclick="location.reload()">🔄 换个壁纸</button>

    <!-- 有兽焉FANS2 eo.mczlf.loft.games https -->

        // 星星

            var s = document.createElement('div');
            s.className = 'star';
            s.style.left = Math.random() * 100 + '%';
            s.style.top = Math.random() * 100 + '%';

    })();
    </script>
</body>
</html>
